image: ghcr.io/prefix-dev/pixi:0.70.2

variables:
  PIXI_LOCKED : "true"
  OPENBLAS_NUM_THREADS : 1
  OMP_NUM_THREADS : 1
  MKL_DYNAMIC : FALSE
  MKL_NUM_THREADS : 1

before_script:
  - pixi global install git

run tests:
  parallel:
    matrix:
      - PIXI_ENV:
        - "test-py311"
        - "test-py312"
        - "test-py313"
  script:
    - pixi run -e $PIXI_ENV tests
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi

run coverage:
  extends: run tests
  parallel: null
  variables:
    PIXI_ENV: "test-sparse"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - build/test-reports/htmlcov
    reports:
      junit: build/test-reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: build/test-reports/coverage.xml


check installed wheel:
  parallel:
    matrix:
      - PIXI_ENV: test-py312
        WHEEL_TASK: check-wheel
      - PIXI_ENV: test-sparse
        WHEEL_TASK: check-wheel-sparse
  script:
    - pixi run -e $PIXI_ENV $WHEEL_TASK
  artifacts:
    paths:
      - dist/
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi

run performance benchmarks:
  when: manual
  script:
    - pixi run -e performance performance-density-scaling
    - pixi run -e performance performance-scf-scaling
  artifacts:
    paths:
      - performance/results/density_scaling.json
      - performance/results/scf_scaling.json
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi

run performance profiles:
  when: manual
  script:
    - pixi run -e performance performance-profile-density
    - pixi run -e performance performance-profile-scf
  artifacts:
    paths:
      - performance/results/hubbard_1d_density_profile.bin
      - performance/results/hubbard_1d_density_profile.json
      - performance/results/hubbard_1d_scf_profile.bin
      - performance/results/hubbard_1d_scf_profile.json
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi


run docs:
  script:
    - pixi run -e docs docs-build
  artifacts:
    paths:
      - docs/build
  cache:
    key: "$CI_JOB_NAME"
    paths:
        - .pixi

pages:
  needs:
    - run docs
  script:
    - mkdir public
    - cp -r docs/build public/
  artifacts:
    paths:
      - public

run pre-commit:
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-cache
  script:
    - pixi run -e precommit git config --global --add safe.directory $CI_PROJECT_DIR
    - pixi run -e precommit pre-commit run --all-files
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pre-commit-cache
      - .pixi

publish to test pypi:
  needs:
    - run tests
    - run coverage
    - check installed wheel
    - run docs
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*\+test$/' # vX.Y.Z.post1+test
  script:
    - pixi run -e publish build
    - pixi run -e publish publish --username __token__ --password $PYPI_TEST_TOKEN --repository testpypi
  cache:
    key: "$CI_JOB_NAME"
    paths:
        - .pixi



publish to pypi:
  needs:
    - run tests
    - run docs
    - run coverage
    - check installed wheel
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+[^+]*$/' # No +test
  script:
    - pixi run -e publish build
    - pixi run -e publish publish --username __token__ --password $PYPI_TOKEN
  cache:
    key: "$CI_JOB_NAME"
    paths:
        - .pixi
