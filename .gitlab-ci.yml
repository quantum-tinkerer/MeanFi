image: ghcr.io/prefix-dev/pixi:0.70.2

variables:
  PIXI_LOCKED : "true"
  OPENBLAS_NUM_THREADS : 1
  OMP_NUM_THREADS : 1
  MKL_DYNAMIC : FALSE
  MKL_NUM_THREADS : 1

before_script:
  - pixi global install git

run tests:
  parallel:
    matrix:
      - PIXI_ENV:
        - "test-py311"
        - "test-py312"
        - "test-py313"
  script:
    - pixi run -e $PIXI_ENV tests
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi

run coverage:
  extends: run tests
  parallel: null
  script:
    - pixi run -e $PIXI_ENV pytest -W error -W ignore:ast.NameConstant:DeprecationWarning
  variables:
    PIXI_ENV: "test-sparse"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - build/test-reports/htmlcov
    reports:
      junit: build/test-reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: build/test-reports/coverage.xml


check installed wheel:
  script:
    - pixi run -e test-py312 build
    - pixi run -e test-py312 python -m venv --system-site-packages build/wheel-env
    - build/wheel-env/bin/python -m pip install --no-deps --ignore-installed dist/*.whl
    - |
      build/wheel-env/bin/python -I - <<'PY'
      from pathlib import Path
      import sys
      import numpy as np
      import meanfi

      assert Path(meanfi.__file__).is_relative_to(Path(sys.prefix))
      density = meanfi.density_matrix_at_mu(
          {(): np.diag([-1., 1.])}, mu=0., keys=[()]
      )
      np.testing.assert_allclose(density.to_tb()[()], np.diag([1., 0.]))
      PY
  artifacts:
    paths:
      - dist/
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi

run benchmarks:
  when: manual
  script:
    - pixi run -e test-sparse benchmark --sparse --output build/benchmarks.json
  artifacts:
    paths:
      - build/benchmarks.json
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi


run docs:
  script:
    - pixi run -e docs docs-build
  artifacts:
    paths:
      - docs/build
  cache:
    key: "$CI_JOB_NAME"
    paths:
        - .pixi

pages:
  needs:
    - run docs
  script:
    - mkdir public
    - cp -r docs/build public/
  artifacts:
    paths:
      - public

run pre-commit:
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-cache
  script:
    - pixi run -e precommit git config --global --add safe.directory $CI_PROJECT_DIR
    - pixi run -e precommit pre-commit run --all-files
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pre-commit-cache
      - .pixi

publish to test pypi:
  needs:
    - run tests
    - run coverage
    - check installed wheel
    - run docs
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*\+test$/' # vX.Y.Z.post1+test
  script:
    - pixi run -e publish build
    - pixi run -e publish publish --username __token__ --password $PYPI_TEST_TOKEN --repository testpypi
  cache:
    key: "$CI_JOB_NAME"
    paths:
        - .pixi



publish to pypi:
  needs:
    - run tests
    - run docs
    - run coverage
    - check installed wheel
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+[^+]*$/' # No +test
  script:
    - pixi run -e publish build
    - pixi run -e publish publish --username __token__ --password $PYPI_TOKEN
  cache:
    key: "$CI_JOB_NAME"
    paths:
        - .pixi
