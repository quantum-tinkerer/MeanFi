[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[project]
name = "meanfi"
dynamic = ["version"]
authors = [
  {name="MeanFi developers"},
]
description = "Package to perform self-consistent mean-field calculations on tight-binding systems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "FermiSimplex @ git+https://gitlab.kwant-project.org/qt/lineartetrahedron.git@05a63879657c50c1d783a2cdd53bd1737a1de27f",
    "numpy>=2.0",
    "scipy>=1.13",
    "threadpoolctl>=3.0",
]

[tool.hatch.version]
path = "meanfi/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["meanfi"]
exclude = ["/meanfi/tests"]

[tool.hatch.build.targets.sdist]
include = [
  "/meanfi",
  "/examples",
  "/README.md",
  "/DESIGN.md",
  "/AGENTS.md",
  "/LICENSE",
  "/pyproject.toml",
  "/AUTHORS.md",
  "/CHANGELOG.md",
]

[project.urls]
"Documentation" = "https://meanfi.readthedocs.io/en/latest/"
"Repository" = "https://gitlab.kwant-project.org/qt/meanfi"
"Bug Tracker" = "https://gitlab.kwant-project.org/qt/meanfi/-/issues"

[project.optional-dependencies]
kwant = ["kwant>=1.4"]
sparse = ["python-mumps"]

[tool.ruff]
cache-dir = "build/test-reports/.ruff_cache"

[tool.codespell]
skip = "*.ipynb, *.cls,*.bst,*.bib,*.lock"
ignore-words-list = "multline, ket, bra, braket, nwo"

[tool.pixi.workspace]
requires-pixi = ">=0.70.2"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-64", "win-64", "osx-arm64"]

[tool.pixi.dependencies]
cmake = ">=3.25"
nanobind = ">=2.2"
ninja = ">=1.11"
numpy = ">=2.0"
scipy = ">=1.13"
scikit-build-core = ">=0.10"
liblapack = ">=3.9,<4"
git = ">=2.47.1,<3"

[tool.pixi.target.linux-64.dependencies]
cxx-compiler = ">=1.11.0,<2"

[tool.pixi.target.osx-64.dependencies]
clang-tools = ">=19.1.7,<20"
cxx-compiler = ">=1.11.0,<2"

[tool.pixi.target.osx-arm64.dependencies]
clang-tools = ">=19.1.7,<20"
cxx-compiler = ">=1.11.0,<2"

[tool.pixi.target.osx.activation.env]
CMAKE_ARGS = "-DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=$CONDA_PREFIX/bin/clang-scan-deps"

[tool.pixi.target.win-64.dependencies]
cxx-compiler = ">=1.11.0,<2"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.3.4,<9"
pytest-cov = ">=6.0.0,<7"
pytest-randomly = ">=3.15.0,<4"
ruff = ">=0.9.6,<0.10"

[tool.pixi.feature.test.pypi-dependencies]
pytest-ruff = ">=0.4.1,<0.5"

[tool.pixi.feature.precommit.dependencies]
pre-commit = ">=3.7.1,<3.8"

[tool.pixi.feature.docs.dependencies]
matplotlib-base = ">=3.8.4,<3.9"
ipykernel = ">=6.29.5,<7"
kwant = ">=1.4"
myst-nb = ">=1.1.2,<2"
requests = "*"
sphinx-togglebutton = "*"
sphinx-copybutton = "*"
make = "*"

[tool.pixi.feature.docs.pypi-dependencies]
numba = ">=0.61"
sphinx-tippy = "*"
sphinx-book-theme = ">=1.1.0"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.sparse.dependencies]
python-mumps = "*"

[tool.pixi.feature.sparse.pypi-dependencies]
meanfi = { path = ".", editable = true, extras = ["sparse"] }

[tool.pixi.feature.kwant.dependencies]
kwant = ">=1.4"

[tool.pixi.feature.build.dependencies]
python-build = ">=1.2"
hatchling = ">=1.27"
pip = "*"

[tool.pixi.feature.publish.dependencies]
twine = ">=6"

[tool.pixi.pypi-dependencies]
meanfi = { path = ".", editable = true }


[tool.pixi.environments]
default = { features = ["py312"], solve-group = "py312" }
test-py311 = { features = ["py311", "test"], solve-group = "py311" }
test-py312 = { features = ["py312", "test", "build"], solve-group = "py312" }
test-py313 = { features = ["py313", "test"], solve-group = "py313" }
test-sparse = { features = ["py312", "test", "build", "sparse", "kwant"], solve-group = "py312" }
docs = { features = ["py312", "docs", "sparse"], solve-group = "py312" }
precommit = { features = ["precommit"], no-default-feature = true }
publish = { features = ["py312", "build", "publish"], no-default-feature = true }

[tool.pixi.feature.test.tasks]
tests = { cmd = "pytest -m \"not perf_slow\" -W error -W ignore:ast.NameConstant:DeprecationWarning", env = { OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1", MKL_DYNAMIC = "FALSE", MKL_NUM_THREADS = "1" } }
tests-perf-slow = { cmd = "pytest -m \"perf_slow\" -W error -W ignore:ast.NameConstant:DeprecationWarning", env = { OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1", MKL_DYNAMIC = "FALSE", MKL_NUM_THREADS = "1" } }


[tool.pixi.tasks]
benchmark = { cmd = "python performance/benchmark.py", env = { OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1", MKL_DYNAMIC = "FALSE", MKL_NUM_THREADS = "1" } }
tests-py311 = "pixi run -e test-py311 tests"
tests-py312 = "pixi run -e test-py312 tests"
tests-py313 = "pixi run -e test-py313 tests"
tests-sparse = "pixi run -e test-sparse tests"
tests-all = { depends-on = ["tests-py311", "tests-py312", "tests-py313", "tests-sparse"] }

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "python -c \"from matplotlib import pyplot\" && make -C docs/ html SPHINXOPTS=\"-E -a -WT --keep-going -n\"", env = { OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1", MKL_DYNAMIC = "FALSE", MKL_NUM_THREADS = "1" } }

[tool.pixi.feature.precommit.tasks]
git = "git"
pre-commit = "pre-commit"

[tool.pixi.feature.build.tasks]
build = "python -m build --no-isolation"

[tool.pixi.feature.publish.tasks]
publish = "twine upload dist/*"
